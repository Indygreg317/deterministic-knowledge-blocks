name: Validate JSON and Reference Evaluator

on:
  push:
    branches: [main, repo-completion-pass, receipt-verification-baseline, canonical-hashing-specification, verification-report-artifact, failure-mode-library, governance-boundary-map, minimal-audit-package, reviewer-handoff, public-readiness-batch]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate reviewer handoff index
        run: |
          test -s docs/reviewer-handoff-index.md
          grep -q "Five-Minute Review Path" docs/reviewer-handoff-index.md
          grep -q "What To Run" docs/reviewer-handoff-index.md
          grep -q "Core Boundary Statement" docs/reviewer-handoff-index.md

      - name: Validate public readiness docs
        run: |
          test -s docs/project-status.md
          test -s docs/glossary.md
          test -s docs/examples-index.md
          test -s docs/roadmap.md
          grep -q "Current Status" docs/project-status.md
          grep -q "Receipt Verification" docs/glossary.md
          grep -q "Primary Bell-State Example" docs/examples-index.md
          grep -q "Near-Term Priorities" docs/roadmap.md

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failures = []
          for path in Path('.').rglob('*.json'):
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  failures.append(f'{path}: {exc}')

          if failures:
              print('JSON validation failed:')
              for failure in failures:
                  print(failure)
              raise SystemExit(1)

          print('All JSON files parsed successfully.')
          PY

      - name: Validate audit package manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('audit-packages/bell-state-minimal/audit-package-manifest.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))

          required = ['audit_package_id', 'audit_package_version', 'purpose', 'package_scope', 'artifacts', 'verification_summary', 'review_boundaries']
          missing = [field for field in required if field not in manifest]
          if missing:
              raise SystemExit(f'Missing audit package manifest fields: {missing}')

          required_artifacts = [artifact for artifact in manifest['artifacts'] if artifact.get('required_for_review')]
          if len(required_artifacts) < 6:
              raise SystemExit('Expected at least six required review artifacts.')

          missing_paths = []
          for artifact in required_artifacts:
              artifact_path = Path(artifact['path'])
              if not artifact_path.exists():
                  missing_paths.append(str(artifact_path))

          if missing_paths:
              raise SystemExit(f'Missing required audit package artifact paths: {missing_paths}')

          summary = manifest['verification_summary']
          if summary.get('expected_verification_status') != 'VALID_RECEIPT':
              raise SystemExit('Expected audit package verification status to be VALID_RECEIPT.')

          print('Audit package manifest validated.')
          PY

      - name: Validate governance boundary map structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('use-cases/quantum/examples/bell-state-governance-boundary-map.json')
          boundary_map = json.loads(path.read_text(encoding='utf-8'))

          required = ['boundary_map_id', 'boundary_map_version', 'scope', 'artifacts', 'boundaries', 'verification_outcomes']
          missing = [field for field in required if field not in boundary_map]
          if missing:
              raise SystemExit(f'Missing boundary map fields: {missing}')

          artifact_types = {artifact['artifact_type'] for artifact in boundary_map['artifacts']}
          expected_types = {
              'structured_input_artifact',
              'decision_contract',
              'evaluator_policy',
              'execution_receipt',
              'verification_report',
          }
          if artifact_types != expected_types:
              raise SystemExit(f'Unexpected artifact types: {artifact_types}')

          outcomes = set(boundary_map['verification_outcomes'])
          expected_outcomes = {'VALID_RECEIPT', 'INVALID_RECEIPT', 'UNSUPPORTED_RECEIPT'}
          if outcomes != expected_outcomes:
              raise SystemExit(f'Unexpected verification outcomes: {outcomes}')

          print('Governance boundary map structure validated.')
          PY

      - name: Run canonical hashing regression checks
        run: |
          python reference-implementation/python/test_canonical_hashing.py

      - name: Run reference evaluator against PASS example
        run: |
          python reference-implementation/python/evaluate_decision_contract.py \
            --output use-cases/quantum/examples/bell-state-output-pass.json

      - name: Run reference evaluator against FAIL example
        run: |
          python reference-implementation/python/evaluate_decision_contract.py \
            --output use-cases/quantum/examples/bell-state-output-fail.json

      - name: Verify valid receipt example
        run: |
          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/bell-state-receipt-pass.json \
            --expect VALID_RECEIPT

      - name: Verify tampered receipt example fails verification
        run: |
          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/bell-state-receipt-tampered-status.json \
            --expect INVALID_RECEIPT

      - name: Generate verification report artifact
        run: |
          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/bell-state-receipt-pass.json \
            --expect VALID_RECEIPT \
            --save-report /tmp/bell-state-verification-report-pass.json

          test -s /tmp/bell-state-verification-report-pass.json

      - name: Validate failure mode library
        run: |
          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/failure-modes/bell-state-receipt-tampered-threshold.json \
            --expect INVALID_RECEIPT

          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/failure-modes/bell-state-receipt-stale-contract-hash.json \
            --expect INVALID_RECEIPT

          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/failure-modes/bell-state-receipt-stale-policy-hash.json \
            --expect INVALID_RECEIPT

          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/failure-modes/bell-state-receipt-missing-input-hash.json \
            --expect INVALID_RECEIPT

          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/failure-modes/bell-state-receipt-wrong-evaluator.json \
            --expect INVALID_RECEIPT

          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/bell-state-receipt-pass.json \
            --contract use-cases/quantum/examples/failure-modes/bell-state-unsupported-operator-contract.json \
            --expect UNSUPPORTED_RECEIPT
