name: Validate JSON and Reference Evaluator

on:
  push:
    branches: [main, repo-completion-pass, receipt-verification-baseline, canonical-hashing-specification, verification-report-artifact, failure-mode-library, governance-boundary-map]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          failures = []
          for path in Path('.').rglob('*.json'):
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  failures.append(f'{path}: {exc}')

          if failures:
              print('JSON validation failed:')
              for failure in failures:
                  print(failure)
              raise SystemExit(1)

          print('All JSON files parsed successfully.')
          PY

      - name: Validate governance boundary map structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('use-cases/quantum/examples/bell-state-governance-boundary-map.json')
          boundary_map = json.loads(path.read_text(encoding='utf-8'))

          required = ['boundary_map_id', 'boundary_map_version', 'scope', 'artifacts', 'boundaries', 'verification_outcomes']
          missing = [field for field in required if field not in boundary_map]
          if missing:
              raise SystemExit(f'Missing boundary map fields: {missing}')

          artifact_types = {artifact['artifact_type'] for artifact in boundary_map['artifacts']}
          expected_types = {
              'structured_input_artifact',
              'decision_contract',
              'evaluator_policy',
              'execution_receipt',
              'verification_report',
          }
          if artifact_types != expected_types:
              raise SystemExit(f'Unexpected artifact types: {artifact_types}')

          outcomes = set(boundary_map['verification_outcomes'])
          expected_outcomes = {'VALID_RECEIPT', 'INVALID_RECEIPT', 'UNSUPPORTED_RECEIPT'}
          if outcomes != expected_outcomes:
              raise SystemExit(f'Unexpected verification outcomes: {outcomes}')

          print('Governance boundary map structure validated.')
          PY

      - name: Run canonical hashing regression checks
        run: |
          python reference-implementation/python/test_canonical_hashing.py

      - name: Run reference evaluator against PASS example
        run: |
          python reference-implementation/python/evaluate_decision_contract.py \
            --output use-cases/quantum/examples/bell-state-output-pass.json

      - name: Run reference evaluator against FAIL example
        run: |
          python reference-implementation/python/evaluate_decision_contract.py \
            --output use-cases/quantum/examples/bell-state-output-fail.json

      - name: Verify valid receipt example
        run: |
          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/bell-state-receipt-pass.json \
            --expect VALID_RECEIPT

      - name: Verify tampered receipt example fails verification
        run: |
          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/bell-state-receipt-tampered-status.json \
            --expect INVALID_RECEIPT

      - name: Generate verification report artifact
        run: |
          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/bell-state-receipt-pass.json \
            --expect VALID_RECEIPT \
            --save-report /tmp/bell-state-verification-report-pass.json

          test -s /tmp/bell-state-verification-report-pass.json

      - name: Validate failure mode library
        run: |
          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/failure-modes/bell-state-receipt-tampered-threshold.json \
            --expect INVALID_RECEIPT

          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/failure-modes/bell-state-receipt-stale-contract-hash.json \
            --expect INVALID_RECEIPT

          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/failure-modes/bell-state-receipt-stale-policy-hash.json \
            --expect INVALID_RECEIPT

          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/failure-modes/bell-state-receipt-missing-input-hash.json \
            --expect INVALID_RECEIPT

          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/failure-modes/bell-state-receipt-wrong-evaluator.json \
            --expect INVALID_RECEIPT

          python reference-implementation/python/verify_receipt.py \
            --receipt use-cases/quantum/examples/bell-state-receipt-pass.json \
            --contract use-cases/quantum/examples/failure-modes/bell-state-unsupported-operator-contract.json \
            --expect UNSUPPORTED_RECEIPT
